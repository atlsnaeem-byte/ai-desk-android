name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Checks that the Kotlin indicators + model give the same numbers as the Python bot.
      - name: Unit tests (Kotlin vs Python parity)
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "AI-Desk-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: AI-Desk-APK-${{ github.run_number }}
          path: AI-Desk-*.apk

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-report
          path: app/build/reports/tests/
